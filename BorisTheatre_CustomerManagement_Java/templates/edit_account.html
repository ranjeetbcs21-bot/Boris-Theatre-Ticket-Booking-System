<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><title>Edit Account | Boris Theatre</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <h1>BORIS THEATRE | Edit Personal Details</h1>
  <nav><a href="/dashboard">Back to Account</a><a href="/logout">Logout</a></nav>
</header>
<div class="container">
  <div class="card" style="max-width: 520px; margin: auto;">
    <h2>Update Contact Information</h2>
    <div class="alert-error">{{error}}</div>
    <form method="POST" action="/edit-account">
      <label>Full Name *</label>
      <input type="text" name="fullName" value="{{fullName}}" required>
      <label>Email Address *</label>
      <input type="email" name="emailAddress" value="{{emailAddress}}" required>
      <label>Phone Number</label>
      <input type="text" name="phoneNumber" value="{{phoneNumber}}">
      <button class="btn" type="submit">Save Changes</button>
      <a class="btn secondary" href="/dashboard">Cancel</a>
    </form>
  </div>
</div>
</body>
</html>
