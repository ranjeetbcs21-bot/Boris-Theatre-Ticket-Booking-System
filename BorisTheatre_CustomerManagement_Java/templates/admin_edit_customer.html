<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><title>Admin Edit Customer | Boris Theatre</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <h1>BORIS THEATRE | Edit Customer #{{customerID}}</h1>
  <nav><a href="/admin/customers">Back to Customer List</a></nav>
</header>
<div class="container">
  <div class="card" style="max-width: 520px; margin: auto;">
    <h2>Edit Customer Record</h2>
    <div class="alert-error">{{error}}</div>
    <form method="POST" action="/admin/edit?id={{customerID}}">
      <label>Full Name *</label>
      <input type="text" name="fullName" value="{{fullName}}" required>
      <label>Email Address *</label>
      <input type="email" name="emailAddress" value="{{emailAddress}}" required>
      <label>Phone Number</label>
      <input type="text" name="phoneNumber" value="{{phoneNumber}}">
      <label style="margin-top: 16px;">
        <input type="checkbox" name="isLoyaltyMember" {{loyaltyChecked}}> Loyalty Membership Active
      </label>
      <button class="btn" type="submit">Update Record</button>
      <a class="btn secondary" href="/admin/customers">Cancel</a>
    </form>
  </div>
</div>
</body>
</html>
